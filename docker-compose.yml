services:
  frontend:
    build: ./services/frontend
    networks:
      - frontend-net
    depends_on:
      auth:
        condition: service_healthy
      tasks:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  auth:
    build: ./services/auth
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-auth_pass}@auth-db:5432/${AUTH_DB_NAME:-auth_db}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - RP_NAME=Todo App
      - RP_ID=${RP_ID:-localhost}
      - RP_ORIGIN=${RP_ORIGIN:-http://localhost:8080}
    networks:
      - frontend-net
      - auth-net
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tasks:
    build: ./services/tasks
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${TASKS_DB_USER:-tasks}:${TASKS_DB_PASSWORD:-tasks_pass}@tasks-db:5432/${TASKS_DB_NAME:-tasks_db}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
    networks:
      - frontend-net
      - tasks-net
    depends_on:
      tasks-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${AUTH_DB_USER:-auth}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD:-auth_pass}
      - POSTGRES_DB=${AUTH_DB_NAME:-auth_db}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - auth-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tasks-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${TASKS_DB_USER:-tasks}
      - POSTGRES_PASSWORD=${TASKS_DB_PASSWORD:-tasks_pass}
      - POSTGRES_DB=${TASKS_DB_NAME:-tasks_db}
    volumes:
      - tasks-db-data:/var/lib/postgresql/data
    networks:
      - tasks-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TASKS_DB_USER:-tasks} -d ${TASKS_DB_NAME:-tasks_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  deploy:
    build: ./services/deploy
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - DEPLOY_SCRIPT=/repo/scripts/deploy.sh
      - DEPLOY_LOG_DIR=/repo/deploy-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
    networks:
      - frontend-net
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-todo-app}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--accept-dns=false --hostname=${TS_HOSTNAME:-todo-app}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve-config.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./services/tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - frontend-net
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      deploy:
        condition: service_started

  e2e:
    build:
      context: .
      dockerfile: services/e2e/Dockerfile
    command: npx playwright test
    environment:
      - BASE_URL=http://frontend:80
    volumes:
      - ./services/e2e/screenshots:/app/services/e2e/screenshots
    networks:
      - frontend-net
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
      - e2e

volumes:
  auth-db-data:
  tasks-db-data:
  tailscale-state:

networks:
  frontend-net:
  auth-net:
  tasks-net:
