services:
  frontend:
    build: ./services/frontend
    ports:
      - "8080:80"
    networks:
      - frontend-net
    depends_on:
      auth:
        condition: service_healthy
      tasks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  auth:
    build: ./services/auth
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://auth:auth_pass@auth-db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - RP_NAME=Todo App
      - RP_ID=localhost
      - RP_ORIGIN=http://localhost:8080
    networks:
      - frontend-net
      - auth-net
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tasks:
    build: ./services/tasks
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://tasks:tasks_pass@tasks-db:5432/tasks_db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
    networks:
      - frontend-net
      - tasks-net
    depends_on:
      tasks-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw r.status;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=auth
      - POSTGRES_PASSWORD=auth_pass
      - POSTGRES_DB=auth_db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - auth-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tasks-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=tasks
      - POSTGRES_PASSWORD=tasks_pass
      - POSTGRES_DB=tasks_db
    volumes:
      - tasks-db-data:/var/lib/postgresql/data
    networks:
      - tasks-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: npx playwright test
    environment:
      - BASE_URL=http://localhost:8080
    volumes:
      - ./e2e:/app/e2e
      - ./playwright.config.ts:/app/playwright.config.ts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./node_modules:/app/node_modules
    network_mode: host
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
      - e2e

volumes:
  auth-db-data:
  tasks-db-data:

networks:
  frontend-net:
  auth-net:
  tasks-net:
